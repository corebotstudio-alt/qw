name: DPanel Cloud Server

on:
  workflow_dispatch:

jobs:
  run-dpanel:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max limit

    steps:
      - name: Deploy DPanel on Docker
        run: |
          echo "Starting DPanel container..."
          docker run -d \
            --name dpanel \
            --restart=always \
            -p 8807:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/dpanel:/dpanel \
            dpanel/dpanel:latest

          echo "Waiting for DPanel to be ready..."
          sleep 5
          curl -I http://127.0.0.1:8807 || true

      - name: Install Cloudflared
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Start Cloudflare Tunnel (Foreground - Kept Alive)
        run: |
          echo "================================================================="
          echo "  STARTING TUNNEL... LOOK BELOW FOR YOUR trycloudflare.com URL"
          echo "================================================================="
          # Running in the foreground ensures GitHub Actions never kills the process
          cloudflared tunnel --url http://127.0.0.1:8807
