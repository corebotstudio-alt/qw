name: Free KVM VPS Runner

on:
  workflow_dispatch:
    inputs:
      ssh_password:
        description: 'Set SSH Password for the VM'
        required: true
        default: 'vps12345'
      os_choice:
        description: 'Choose Operating System'
        required: true
        default: 'debian12'
        type: choice
        options:
          - debian12
          - ubuntu22
          - ubuntu24

jobs:
  launch-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Hardware KVM & Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils wget curl
          # Grant permissions to /dev/kvm
          sudo chmod 666 /dev/kvm
          echo "Hardware KVM is ready!"

      - name: Download Cloud Image & Configure Cloud-Init
        run: |
          mkdir -p vps-data
          cd vps-data
          
          if [ "${{ github.event.inputs.os_choice }}" = "debian12" ]; then
            IMG_URL="https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2"
          elif [ "${{ github.event.inputs.os_choice }}" = "ubuntu22" ]; then
            IMG_URL="https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
          else
            IMG_URL="https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
          fi

          echo "Downloading $IMG_URL..."
          wget -q --show-progress "$IMG_URL" -O disk.qcow2
          qemu-img resize disk.qcow2 25G

          cat > user-data <<EOF
          #cloud-config
          hostname: kvm-vps
          ssh_pwauth: true
          disable_root: false
          users:
            - name: root
              shell: /bin/bash
              password: $(openssl passwd -6 "${{ github.event.inputs.ssh_password }}")
          chpasswd:
            list: |
              root:${{ github.event.inputs.ssh_password }}
            expire: false
          EOF

          cat > meta-data <<EOF
          instance-id: iid-kvm-vps
          local-hostname: kvm-vps
          EOF

          cloud-localds seed.iso user-data meta-data

      - name: Setup Cloudflare Tunnel for Remote SSH
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          
          cloudflared tunnel --url tcp://localhost:2222 --logfile tunnel.log > /dev/null 2>&1 &
          sleep 5

      - name: Display Connection Details
        run: |
          echo "=========================================================="
          echo "   YOUR KVM VPS IS READY!"
          echo "=========================================================="
          echo "Username: root"
          echo "Password: ${{ github.event.inputs.ssh_password }}"
          echo "----------------------------------------------------------"
          cat tunnel.log | grep -E 'trycloudflare.com' || true
          echo "=========================================================="

      - name: Launch KVM VM (Hardware Accelerated)
        run: |
          cd vps-data
          qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 6144M \
            -smp 2 \
            -drive file=disk.qcow2,format=qcow2,if=virtio \
            -drive file=seed.iso,format=raw,if=virtio \
            -device virtio-net-pci,netdev=n0 \
            -netdev user,id=n0,hostfwd=tcp::2222-:22 \
            -nographic \
            -serial mon:stdio
